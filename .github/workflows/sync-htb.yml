name: Sync HTB Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync from HTB API
        env:
          HTB_API_TOKEN: ${{ secrets.HTB_API_TOKEN }}
          HTB_USER_ID: ${{ vars.HTB_USER_ID }}
        run: node ./scripts/sync-htb.mjs

      - name: Commit synced data
        run: |
          if [ -n "$(git status --porcelain src/data/htb.json)" ]; then
            git add src/data/htb.json
            git commit -m "chore: sync htb stats"
            git push
          else
            echo "No changes in HTB data"
          fi
