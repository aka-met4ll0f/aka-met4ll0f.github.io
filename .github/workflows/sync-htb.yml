name: Sync HTB Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync from HTB API
        env:
          HTB_API_TOKEN: ${{ secrets.HTB_API_TOKEN }}
          HTB_USER_ID: ${{ vars.HTB_USER_ID }}
        run: node ./scripts/sync-htb.mjs

      - name: Configure git identity for commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit synced data
        run: |
          if [ -n "$(git status --porcelain src/data/htb.json)" ]; then
            git add src/data/htb.json
            git commit -m "chore: sync htb stats"
            git push
          else
            echo "No changes in HTB data"
          fi
